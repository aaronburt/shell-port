services:
  shellport:
    image: ghcr.io/aaronburt/shell-port:latest
    build: .
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      SHELLPORT_VAULT: /vault/vault.sealed
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./vault:/vault
