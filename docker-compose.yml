services:
  shellport:
    image: ghcr.io/aaronburt/shell-port:latest
    build: .
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    env_file: .env
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./config.json:/config/config.json:ro
      - ./keys:/config/keys:ro
