services:
  shellport:
    image: ghcr.io/aaronburt/shell-port:latest
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      SHELLPORT_VAULT: /vault/vault.sealed
      SHELLPORT_TRUST_PROXY: "1"
    volumes:
      - ./vault:/vault
    expose: ["8080"]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

volumes:
  caddy_data:
